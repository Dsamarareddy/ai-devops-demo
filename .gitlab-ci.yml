stages:
  - .pre
  - build
  - test
  - deploy
  - .post

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

.pre:setup:
  stage: .pre
  image: node:18
  script:
    - echo "Validating environment..."
    - node --version
    - npm --version
    - if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$EKS_CLUSTER_NAME" ] || [ -z "$AWS_DEFAULT_REGION" ] || [ -z "$KUBE_DEPLOYMENT_MANIFEST" ]; then echo "Missing required environment variables" && exit 1; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  artifacts:
    paths: []
  cache:
    key: setup
    paths: []

build:
  stage: build
  image: node:18
  before_script:
    - npm ci
  script:
    - echo "Building Docker image..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  artifacts:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
    expire_in: 1 hour
  cache:
    key: build
    paths:
      - node_modules/
  needs: [ '.pre:setup' ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

unit_test:
  stage: test
  image: node:18
  before_script:
    - npm ci
  script:
    - echo "Running tests..."
    - npm test
  artifacts:
    when: always
    paths:
      - junit.xml
    reports:
      junit: junit.xml
    expire_in: 1 hour
  cache:
    key: test
    paths:
      - node_modules/
  needs: [ 'build' ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

.deploy:aws_eks:
  stage: deploy
  image:
    name: amazon/aws-cli:2.13.14
    entrypoint: ['']
  before_script:
    - apk add --no-cache curl bash git
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - aws --version
    - kubectl version --client
  script:
    - echo "Configuring AWS credentials..."
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_DEFAULT_REGION
    - echo "Deploying to EKS..."
    - kubectl apply -f $KUBE_DEPLOYMENT_MANIFEST
  environment:
    name: production
    url: https://$EKS_CLUSTER_NAME.eks.amazonaws.com
  dependencies:
    - build
    - unit_test
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
  artifacts:
    paths: []
  cache:
    key: deploy
    paths: []

.post:cleanup:
  stage: .post
  image: node:18
  script:
    - echo "Cleanup stage (optional)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  artifacts:
    paths: []
  cache:
    key: cleanup
    paths: []
