stages:
  - .pre
  - build
  - test
  - deploy
  - .post

variables:
  NODE_ENV: production

before_script:
  - echo "Setting up Node.js environment"
  - node --version
  - npm --version
  - npm ci

.pre-validate:
  stage: .pre
  script:
    - echo "Validating environment variables..."
    - 'for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION EKS_CLUSTER_NAME KUBE_NAMESPACE; do if [ -z "${!var}" ]; then echo "$var is not set"; exit 1; fi; done'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - echo "Building the Express app..."
    - npm run build || echo "No build script, skipping."
  artifacts:
    paths:
      - node_modules/
      - dist/
      - build/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: '$CI_COMMIT_BRANCH'
  needs: [".pre-validate"]

test:
  stage: test
  script:
    - echo "Running tests..."
    - npm test
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - coverage/
      - junit.xml
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Deploy job assumes kubectl and awscli are available in the image
# You may want to use a custom image or install them in before_script

deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.0
  before_script:
    - echo "Installing kubectl..."
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x ./kubectl
    - mv ./kubectl /usr/local/bin/kubectl
    - aws --version
    - kubectl version --client
    - echo "Configuring AWS credentials..."
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
    - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME
  script:
    - echo "Deploying to AWS EKS..."
    - kubectl config use-context arn:aws:eks:$AWS_DEFAULT_REGION:$AWS_ACCOUNT_ID:cluster/$EKS_CLUSTER_NAME
    - kubectl apply -f k8s/ -n $KUBE_NAMESPACE
  environment:
    name: production
    url: https://$EKS_CLUSTER_NAME.eks.amazonaws.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  dependencies:
    - test
  artifacts:
    paths:
      - k8s/
    expire_in: 30 min

.post-cleanup:
  stage: .post
  script:
    - echo "Cleanup complete."
  rules:
    - when: always
