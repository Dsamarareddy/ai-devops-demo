stages:
  - .pre
  - build
  - test
  - .post

before_script:
  - echo "Node version: $(node -v)"
  - npm install

validate_setup:
  stage: .pre
  script:
    - echo "Validating setup..."
    - test -f package.json || (echo 'Missing package.json' && exit 1)
  rules:
    - if: '$CI_COMMIT_REF_NAME'
  artifacts:
    paths:
      - package.json
    expire_in: 1 hour

build_app:
  stage: build
  script:
    - echo "Building Express app..."
    - npm run build || echo "No build script defined, skipping."
  needs:
    - validate_setup
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME'

run_tests:
  stage: test
  script:
    - echo "Running tests..."
    - npm test
  needs:
    - build_app
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - node_modules/
  artifacts:
    paths:
      - test-results/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME'

cleanup:
  stage: .post
  script:
    - echo "Cleanup after pipeline."
  rules:
    - if: '$CI_COMMIT_REF_NAME'
