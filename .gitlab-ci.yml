stages:
  - .pre
  - build
  - test
  - .post

before_script:
  - echo "Node.js version: $(node -v)"
  - npm install

.pre-setup:
  stage: .pre
  script:
    - echo "Validating setup..."
    - test -f package.json || (echo 'Missing package.json' && exit 1)
  rules:
    - if: '$CI_COMMIT_REF_NAME != "main"'
      when: always
  artifacts:
    paths:
      - package.json
    expire_in: 1 hour

build:
  stage: build
  script:
    - npm run build || echo "No build script defined, skipping"
  needs:
    - .pre-setup
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always
    - if: '$CI_COMMIT_REF_NAME != "main"'
      when: manual

unit_test:
  stage: test
  script:
    - npm test
  needs:
    - build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - node_modules/
  artifacts:
    paths:
      - test-results/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_REF_NAME'
      when: always

.post-cleanup:
  stage: .post
  script:
    - echo "Cleanup after pipeline"
  needs:
    - unit_test
  rules:
    - if: '$CI_COMMIT_REF_NAME'
      when: always
