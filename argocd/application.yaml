---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: express-app-eks
  namespace: argocd
spec:
  project: eks-apps
  source:
    repoURL: https://github.com/your-org/express-app.git  # <-- Update to your repo
    targetRevision: main
    path: k8s-manifests  # <-- Update to the directory containing your manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: express-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
#
# Note: If you have dependencies (e.g. database), add sync-wave annotations to manifests.
#       If you have migration jobs, define them with PreSync hooks in your manifests.
#       ArgoCD health checks rely on readiness/liveness probes in your Deployment.
