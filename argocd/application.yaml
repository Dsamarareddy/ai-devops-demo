---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: express-app-eks
  namespace: argocd
spec:
  project: eks-apps
  source:
    repoURL: https://github.com/your-org/express-app.git
    targetRevision: main
    path: manifests/
  destination:
    server: https://kubernetes.default.svc
    namespace: express-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
