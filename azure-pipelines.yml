trigger:
  branches:
    include:
      - main
      - master

variables:
  - group: 'aws-eks-variables' # Contains AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, EKS_CLUSTER_NAME, etc.

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Use Node.js 18.x'

          - script: |
              npm install
            displayName: 'Install dependencies'

          - script: |
              npm run build || echo "No build script defined, skipping."
            displayName: 'Build app'

          - script: |
              npm test
            displayName: 'Run tests'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
              repository: 'my-express-app'

          - task: Docker@2
            displayName: 'Push Docker image'
            inputs:
              command: push
              repository: 'my-express-app'
              tags: |
                $(Build.BuildId)

          - publish: $(System.DefaultWorkingDirectory)
            artifact: drop
            displayName: 'Publish source as artifact'

  - stage: Deploy
    displayName: 'Deploy to AWS EKS'
    dependsOn: Build
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to EKS'
        environment: 'aws-eks-prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: drop
                    path: $(Pipeline.Workspace)/drop
                  displayName: 'Download build artifact'

                - script: |
                    echo "Configuring AWS CLI..."
                    aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
                    aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
                    aws configure set region $AWS_REGION
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_REGION: $(AWS_REGION)
                  displayName: 'Configure AWS CLI credentials'

                - script: |
                    echo "Updating kubeconfig for EKS cluster..."
                    aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_REGION: $(AWS_REGION)
                    EKS_CLUSTER_NAME: $(EKS_CLUSTER_NAME)
                  displayName: 'Update kubeconfig for EKS'

                - script: |
                    echo "Deploying to EKS..."
                    kubectl apply -f k8s/
                  displayName: 'kubectl apply manifests'
